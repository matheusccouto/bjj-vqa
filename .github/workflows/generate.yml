name: Generate Questions

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL of the BJJ instructional video'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Generate questions from YouTube URL
        env:
          OPENROUTER_API_KEY: *** secrets.OPENROUTER_API_KEY }}
        run: uv run bjj-vqa generate "${{ inputs.url }}"

      - name: Create pull request
        env:
          GH_TOKEN: *** github.token }}
        run: |
          BRANCH="clawdinho/generated-$(date +%s)"
          git config user.name "clawdinhobot"
          git config user.email "clawdinhobot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/ sources/
          git commit -m "Add generated questions from workflow"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Add generated questions from workflow" \
            --body "Automatically generated questions from \`${{ inputs.url }}\`." \
            --reviewer matheusccouto
